<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Secreta | Clube Literário</title>
  <style>
    body {
      background-color: #121212 !important;
      color: #E5D3A6 !important;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background-color: #F8F4EC;
      color: #121212;
      padding: 30px;
      border-radius: 16px;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #C5A059;
    }
    h1 {
      color: #4A0E17;
      margin-top: 0;
    }
    .btn {
      display: inline-block;
      background-color: #4A0E17;
      color: #E5D3A6;
      padding: 12px 24px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <p style="color: #4A0E17; font-weight: bold;">✦ Cantinho Oficial da Comunidade</p>
    <h1>PÁGINA SECRETA</h1>
    <p><i>“Todo livro guarda um segredo. Além dele, descobrimos mistérios.”</i></p>
    <a href="https://instagram.com" class="btn" target="_blank">Oi, leitora! Pronta pro próximo capítulo? ✨</a>
  </div>

  <p style="margin-top: 30px; font-size: 12px; opacity: 0.7;">© Página Secreta • Clube Literário</p>

</body>
</html>
